services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  miner:
    build: ./miner
    environment:
      - REDIS_HOST=redis
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      - redis

  visualizer:
    build: ./visualizer
    ports:
      - "8501:8501"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis